query GetPullRequests($zombieGrade: ZombieGrade) {
    pullRequests(zombieGrade: $zombieGrade) {
        id
        title
        author
        zombieGrade
        staleDays
        lastActivityAt
    }
}

query GetPullRequest($id: String!) {
    pullRequest(id: $id) {
        id
        title
        author
        zombieGrade
        staleDays
        lastActivityAt
    }
}

mutation MarkAsHunted($prId: String!, $hunterId: String!) {
    markAsHunted(prId: $prId, hunterId: $hunterId, actionType: "HUNT") {
        id
        prId
        hunterId
        createdAt
    }
}
