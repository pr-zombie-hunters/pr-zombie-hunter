version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - collector
      - grader
      - notifier
      - graphql-service

  collector:
    build: ./collector
    ports:
      - "8081:8081"
    depends_on:
      - mysql

  grader:
    build: ./grader
    ports:
      - "8082:8082"
    depends_on:
      - mysql

  notifier:
    build: ./notifier
    ports:
      - "8083:8083"
    depends_on:
      - mysql

  graphql-service:
    build: ./graphql-service
    ports:
      - "8084:8084"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zombie_hunter
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: