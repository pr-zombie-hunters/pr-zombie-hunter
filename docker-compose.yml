version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "8090:8080"
    depends_on:
      - collector
      - grader
      - notifier
      - api-service

  collector:
    build: ./collector
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zombie_hunter?serverTimezone=Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: root
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

  grader:
    build: ./grader
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zombie_hunter?serverTimezone=Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: root

  notifier:
    build: ./notifier
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zombie_hunter?serverTimezone=Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: root
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      NOTIFY_RECIPIENTS: ${NOTIFY_RECIPIENTS}

  api-service:
    build: ./api-service
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zombie_hunter?serverTimezone=Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: root

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zombie_hunter
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
