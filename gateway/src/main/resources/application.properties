spring.application.name=gateway
server.port=8080

# 라우팅 설정
spring.cloud.gateway.mvc.routes[0].id=collector
spring.cloud.gateway.mvc.routes[0].uri=http://collector:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/collector/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[1].id=grader
spring.cloud.gateway.mvc.routes[1].uri=http://grader:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/grader/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[2].id=notifier
spring.cloud.gateway.mvc.routes[2].uri=http://notifier:8083
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/notifier/**
spring.cloud.gateway.mvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[3].id=api-service
spring.cloud.gateway.mvc.routes[3].uri=http://api-service:8084
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/**
spring.cloud.gateway.mvc.routes[3].filters[0]=StripPrefix=0
